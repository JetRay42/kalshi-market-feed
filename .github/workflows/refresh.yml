name: Refresh Kalshi public market quotes

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write

concurrency:
  group: kalshi-public-quotes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh existing all-market feed (backward-compatible)
        id: legacy
        continue-on-error: true
        run: python collector.py --config config.json --watchlist watchlist.json --out data
      - name: Collect independent sports, pop culture, weather/politics feeds
        id: categories
        continue-on-error: true
        run: python category_collector.py --profiles category_profiles.json --output data/feeds
      - name: Publish successful outputs (failed profiles retain last good files)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public Kalshi market snapshots'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Report any collection failure
        if: steps.legacy.outcome == 'failure' || steps.categories.outcome == 'failure'
        run: |
          echo 'One or more feeds failed. Successful files were published and older failed-feed files were preserved.'
          exit 1
