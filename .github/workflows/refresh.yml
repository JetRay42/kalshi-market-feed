
name: Refresh Kalshi public market quotes

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write

concurrency:
  group: kalshi-public-quotes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve public Kalshi quotes (read-only API)
        run: python collector.py --config config.json --watchlist watchlist.json --out data
      - name: Commit latest snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public Kalshi snapshots'
            git pull --rebase origin main
            git push origin main
          fi
